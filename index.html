<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover nutzt das gesamte Display inklusive Notch & Home-Bar -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Browser-Leisten & Statusbar-Farben -->
  <meta name="theme-color" content="#0b1d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Adventskalender2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fixierte Hintergrundschicht (verhindert weiße Ränder beim Scrollen/Bouncen) -->
  <div class="bg-layer"></div>

  <!-- Schneefall -->
  <div id="snow-container"></div>

  <div class="app-wrapper">
    <header>
      <h1>✨ Adventskalender ✨</h1>
      <p>Finde und öffne das heutige Türchen</p>
    </header>

    <!-- Freier Bereich für verstreute Türchen -->
    <main class="calendar-canvas" id="calendar"></main>

    <div class="controls">
      <label class="toggle-label">
        <input type="checkbox" id="test-mode">
        <span>Testmodus</span>
      </label>
      <button class="btn-text" id="reset-btn">Neu anordnen</button>
    </div>
  </div>

  <!-- Modal / Großansicht -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-badge" id="modal-day-badge">Tag 1</div>
      <div class="modal-icon">🎁</div>
      <p id="modal-content">Inhalt</p>
      <button class="btn-primary" id="modal-close">Schließen</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
